# Netlify: the web dashboard (apps/web). Build from the repo root so npm workspaces (@verba/shared) resolve.
[build]
  command = "npm run build -w @verba/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build files never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source maps are for debugging only; keep them out of search results.
[[headers]]
  for = "/assets/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Single-page app: let the client router handle /users, /usage, /connect … on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
