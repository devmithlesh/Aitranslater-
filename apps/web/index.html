<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Verba · AI writing &amp; translation assistant</title>
    <meta
      name="description"
      content="Verba translates and rewrites what you type into clear, natural English in any tone. Works on the web and in any text box with the Verba Chrome extension."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verba" />
    <meta property="og:title" content="Verba · AI writing &amp; translation assistant" />
    <meta
      property="og:description"
      content="Write in your language. Send it in perfect English, in any tone, right where you type."
    />
    <meta property="og:url" content="https://verba-trans-ai.netlify.app/" />
    <meta property="og:image" content="https://verba-trans-ai.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Verba: write in your language, send it in perfect English." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verba · AI writing &amp; translation assistant" />
    <meta name="twitter:description" content="Write in your language. Send it in perfect English, in any tone." />
    <meta name="twitter:image" content="https://verba-trans-ai.netlify.app/og-image.png" />

    <!-- Start fetching the API origin early. -->
    <link rel="preconnect" href="https://aitranslater.onrender.com" crossorigin />
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('verba.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Verba needs JavaScript to run. Please enable it in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
