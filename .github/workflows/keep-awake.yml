# Keeps the Render free-tier backend awake. Render puts a free web service to sleep after 15 minutes
# without requests, and the next visitor then waits 30-60 seconds. This pings the public health check
# (no login, no database work) every 10 minutes so that does not happen.
#
# Notes:
# - GitHub may start scheduled runs a few minutes late when it is busy, so a rare cold start can still happen.
# - GitHub turns scheduled workflows off after 60 days without any commit to the repository; re-enable it
#   under the Actions tab if that happens.
# - To ping a different server, set a repository variable named BACKEND_HEALTH_URL
#   (Settings -> Secrets and variables -> Actions -> Variables).
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://aitranslater.onrender.com/api/health' }}
        run: |
          # A sleeping service can take up to a minute to wake, so allow for that and retry a few times.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" "$HEALTH_URL"
