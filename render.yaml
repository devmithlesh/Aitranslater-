# Render Blueprint for the Verba backend (https://render.com/docs/blueprint-spec).
# Builds the repo-root Dockerfile (Node 22, non-root user).
services:
  - type: web
    name: verba-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # Render's free disk is temporary, so storage lives in Supabase.
      - key: STORAGE
        value: supabase
      # Set these in the Render dashboard (never commit real values):
      - key: VERBA_ACCESS_TOKEN
        sync: false
      - key: VERBA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://verba-trans-ai.netlify.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
